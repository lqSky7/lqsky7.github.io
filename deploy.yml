jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Inject Token
      run: |
        sed -i "s/const GITHUB_TOKEN = .*/const GITHUB_TOKEN = '${{ secrets.GH_PAGES_TOKEN }}';/" path/to/your/script.js

    - name: Deploy
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GH_PAGES_TOKEN }}
